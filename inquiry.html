  <main>
    <div class="inquiry-page-container">
      <h1>Anfrageliste</h1>
      <p class="inquiry-intro">Hier sehen Sie alle Produkte, die Sie zur Anfrage vorgemerkt haben.
      Füllen Sie das Formular aus, um die Liste an uns zu senden.</p>

      <div id="inquiry-list" class="inquiry-list"></div>

      <h2>Anfrage senden</h2>
      <form id="inquiry-form" class="inquiry-form">
        <label for="inquiry-name">Name *</label>
        <input type="text" id="inquiry-name" name="name" required autocomplete="name">

        <label for="inquiry-company">Firma</label>
        <input type="text" id="inquiry-company" name="company" autocomplete="organization">

        <label for="inquiry-email">E-Mail *</label>
        <input type="email" id="inquiry-email" name="email" required autocomplete="email">

        <label for="inquiry-message">Nachricht</label>
        <textarea id="inquiry-message" name="message" rows="6" placeholder="Ihre Nachricht an uns ..."></textarea>

        <button type="submit" id="inquiry-submit" class="inquiry-submit-btn">Anfrage an info@modusfurniture.eu senden</button>
        <p id="inquiry-status" class="inquiry-status"></p>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; Modus Furniture</p>
  </footer>
